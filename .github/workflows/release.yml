name: Release Workflow

on:
  push:
    branches: [development, release-*]

jobs:
  release:
    uses: epam/ai-dial-ci/.github/workflows/python_package_release.yml@3.1.3
    secrets: inherit
    with:
      python-version: "3.10"
      poetry-version: "2.2.1"
      code-checks-python-versions: '["3.10", "3.11", "3.12", "3.13"]'
